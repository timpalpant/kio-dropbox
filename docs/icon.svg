    SPDX-License-Identifier: GPL-2.0-or-later

    An open box with a file dropping into it: "drop" and "box", literally.
    Deliberately not Dropbox's own glyph, which their branding guidelines
    supply for affordances such as "Save to Dropbox" buttons rather than for
    use as a third-party application's icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1d76a8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6dc7f5"/>
      <stop offset="1" stop-color="#3daee9"/>
    </linearGradient>
  </defs>

  <!-- The sheet is drawn first so the box front overlaps it: the file reads as
       going into the box rather than sitting on top of it. -->
  <path d="M23 6h12l7 7v19H23z" fill="#ffffff"/>
  <path d="M35 6l7 7h-7z" fill="#cfd8dc"/>

  <!-- Flaps, opened outward. -->
  <path d="M8 32h24l-6-9H2z" fill="url(#flap)"/>
  <path d="M56 32H32l6-9h24z" fill="url(#flap)"/>

  <path d="M8 32h48v18a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="url(#box)"/>
  <!-- Shadow just inside the opening, so the box reads as hollow. -->
  <path d="M8 32h48v5H8z" fill="#0b3d5c" opacity="0.22"/>
</svg>
